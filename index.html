<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlante Evolutivo 3D &amp; Geografico</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3/dist/d3-array.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- Area Visualizzazione Principale (Unico Canvas per Spazio 3D e Mappa Geografica d3-geo) -->
    <main id="wrap">
      <canvas id="cv" aria-label="Atlante interattivo delle immagini"></canvas>
      <div id="tip"></div>
    </main>

    <!-- Header discreto in alto a sinistra -->
    <header class="brand-badge">
      <h1>Atlante Evolutivo</h1>
      <p class="sub">Archaeopteryx, Pettirossi &amp; Grilli</p>
    </header>

    <!-- ALTO A DESTRA: Menu a tendina Categorie & Ricerca -->
    <div class="top-right-dock">
      <details class="dropdown-card" id="cat-dropdown">
        <summary>
          <span>Categorie &amp; Ricerca</span>
          <span class="badge-count" id="vis-count">0</span>
        </summary>
        <div class="dropdown-body">
          <input type="search" id="q" placeholder="Cerca ID, luogo, soggetto…">
          <div class="chips-grid" id="chips"></div>
          <div class="divider"></div>
          <details class="sub-acc" id="dati-acc">
            <summary>Sorgente Dati (CSV / Immagini)</summary>
            <div class="sub-acc-body">
              <label for="fc">02_database/database_immagini.csv</label>
              <input type="file" id="fc" accept=".csv,text/csv">
              <label for="fi">Cartella immagini</label>
              <input type="file" id="fi" accept="image/*" multiple>
              <div class="row">
                <button type="button" class="p" id="go">Crea mappa</button>
                <button type="button" id="ex">Dati esempio</button>
              </div>
            </div>
          </details>
          <p id="st" aria-live="polite"></p>
          <p id="wn"></p>
        </div>
      </details>
    </div>

    <!-- SINISTRA: Pannello scorrevole della Tavola Selezionata -->
    <aside id="detail-drawer" aria-hidden="true">
      <div class="drawer-head">
        <span class="drawer-eyebrow">Scheda Tavola</span>
        <button type="button" id="close-det" class="icon-btn" aria-label="Chiudi scheda" title="Chiudi scheda">✕</button>
      </div>
      <div class="drawer-scroll">
        <canvas id="big" width="440" height="330"></canvas>
        <h2 id="det-title"></h2>
        <dl id="dl"></dl>
        <div class="note">Tavole più affini nello spazio visivo:</div>
        <div id="nb"></div>
      </div>
    </aside>

    <!-- BASSO A DESTRA: Switch Vista + Pulsante Impostazioni Visualizzazione + Zoom -->
    <div class="bottom-right-dock">
      <div id="view-settings-popover" class="popover-card" hidden>
        <div class="popover-title">Impostazioni Visualizzazione</div>
        <div class="settings-list">
          <button type="button" id="rot-auto" aria-pressed="true">↻ Rotazione 3D: ON</button>
          <button type="button" id="md">✦ Solo punti luminosi</button>
          <button type="button" id="tr">▶ Passeggiata guidata</button>
          <button type="button" id="cp">⧉ Esporta coordinate</button>
        </div>
        <textarea id="out" hidden readonly></textarea>
        <div class="zoom-bar">
          <button id="zi" type="button" aria-label="Ingrandisci" title="Ingrandisci">+</button>
          <button id="zo" type="button" aria-label="Riduci" title="Riduci">−</button>
          <button id="zr" type="button" aria-label="Ripristina vista" title="Ripristina vista">⟲</button>
        </div>
      </div>

      <div class="bottom-controls-bar">
        <div class="segmented-switch" role="group" aria-label="Cambia visualizzazione">
          <button id="vw-3d" type="button" class="is-active" aria-pressed="true">✦ Spazio 3D</button>
          <button id="vw-geo" type="button" aria-pressed="false">⌖ Mappa Geografica</button>
        </div>
        <button id="btn-settings" type="button" class="settings-trigger" aria-expanded="false" aria-controls="view-settings-popover" title="Impostazioni visualizzazione">
          ⚙ Opzioni
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
